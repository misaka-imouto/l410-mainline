<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Copied verbatim from the UOS vendor root; without it dbus-daemon
       refuses to let fingerprint_daemon own com.huawei.Fingerprint. -->
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.huawei.Fingerprint"/>
    <allow own="com.huawei.enroll"/>
    <allow own="com.huawei.identify"/>
    <allow own="com.huawei.status"/>
    <allow own="com.huawei.FactoryTest"/>

    <allow send_interface="com.huawei.Fingerprint"/>
  </policy>

  <!-- Anyone can talk to the service -->
  <policy context="default">
    <deny send_interface="com.huawei.Fingerprint"/>
    <allow send_destination="com.huawei.enroll"/>
    <allow send_interface="com.huawei.enroll"/>
    <allow send_destination="com.huawei.identify"/>
    <allow send_interface="com.huawei.identify"/>
    <allow send_destination="com.huawei.status"/>
    <allow send_interface="com.huawei.status"/>
    <allow send_destination="com.huawei.FactoryTest"/>
    <allow send_interface="com.huawei.FactoryTest"/>
  </policy>

</busconfig>
