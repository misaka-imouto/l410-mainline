# The fingerprint sensor sits on the power button: a light touch is a
# capacitive scan, but a firm press is a power-key event.  The vendor UOS
# image sets HandlePowerKey=ignore so enrolling/identifying never powers the
# machine off (observed on 6.18 as "Power key pressed short" -> "Powering off").
[Login]
HandlePowerKey=ignore
HandleLidSwitch=ignore
